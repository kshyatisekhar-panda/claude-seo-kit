# SEO gate: fails the pull request when SEO-critical tags break.
# Generated by Claude SEO Kit (/seo-kit ci). Adjust the three marked lines.
name: SEO check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the SEO checker
        run: |
          git clone --depth 1 --branch v2.0.0 \
            https://github.com/kshyatisekhar-panda/claude-seo-kit.git "$RUNNER_TEMP/seo-kit"
          pip install -r "$RUNNER_TEMP/seo-kit/requirements.txt"

      # 1. Static output (Next.js output: "export", Astro, Eleventy, Hugo).
      #    Change "out" to your build folder and the URL to your production origin.
      - name: SEO check
        run: |
          python "$RUNNER_TEMP/seo-kit/run.py" ci \
            --dir out \
            --base-url https://example.com

      # 2. Server-rendered sites: delete the step above and use this one.
