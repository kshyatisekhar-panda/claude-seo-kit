<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Claude SEO Kit: SEO audits for Claude Code">
  <title>Claude SEO Kit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#131C36"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#4F7CFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0885F"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2340"/>
      <stop offset="1" stop-color="#121931"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .row { opacity: 0; animation: rise 0.5s ease-out forwards; }
      .r1 { animation-delay: 0.3s; } .r2 { animation-delay: 0.6s; } .r3 { animation-delay: 0.9s; }
      .r4 { animation-delay: 1.2s; } .r5 { animation-delay: 1.5s; } .r6 { animation-delay: 1.8s; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .ring { stroke-dasharray: 0 302; animation: fill 1.6s ease-out 0.4s forwards; }
      @keyframes fill { to { stroke-dasharray: 248 302; } }
      @media (prefers-reduced-motion: reduce) {
        .row { opacity: 1; animation: none; } .ring { stroke-dasharray: 248 302; animation: none; } .cursor { animation: none; }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="640" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="640" rx="24" fill="url(#glowB)"/>

  <!-- left: identity -->
  <g class="sans">
    <rect x="80" y="150" width="212" height="34" rx="17" fill="#D97757" fill-opacity="0.12" stroke="#D97757" stroke-opacity="0.45"/>
    <circle cx="101" cy="167" r="4.5" fill="#F0885F"/>
    <text x="115" y="172" font-size="14" font-weight="600" letter-spacing="1.6" fill="#F3B49B">CLAUDE CODE PLUGIN</text>

    <text x="78" y="262" font-size="76" font-weight="800" letter-spacing="-2" fill="#F5F6FA">Claude SEO</text>
    <text x="78" y="344" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#word)">Kit</text>

    <text x="80" y="400" font-size="22" fill="#A9B2CC">Audit any website from your terminal.</text>
    <text x="80" y="432" font-size="22" fill="#A9B2CC">Technical SEO, content, schema, speed</text>
    <text x="80" y="464" font-size="22" fill="#A9B2CC">and AI search in one command.</text>

    <!-- stats -->
    <g transform="translate(80 508)">
      <rect width="118" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="16" y="28" font-size="22" font-weight="700" fill="#F5F6FA">16</text>
      <text x="16" y="46" font-size="12.5" fill="#8590AD">skills</text>
      <rect x="130" width="118" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="146" y="28" font-size="22" font-weight="700" fill="#F5F6FA">75</text>
      <text x="146" y="46" font-size="12.5" fill="#8590AD">checks</text>
      <rect x="260" width="118" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="276" y="28" font-size="22" font-weight="700" fill="#F5F6FA">6</text>
      <text x="276" y="46" font-size="12.5" fill="#8590AD">score areas</text>
    </g>
  </g>

  <!-- right: terminal card -->
  <g transform="translate(600 104)" filter="url(#shadow)">
    <rect width="600" height="432" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M18 0h564a18 18 0 0 1 18 18v28H0V18A18 18 0 0 1 18 0z" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="26" cy="23" r="6" fill="#FF5F57"/>
    <circle cx="46" cy="23" r="6" fill="#FEBC2E"/>
    <circle cx="66" cy="23" r="6" fill="#28C840"/>
    <text x="300" y="28" text-anchor="middle" class="sans" font-size="13" fill="#6F7A99">claude</text>

    <g class="mono" font-size="17">
      <text x="30" y="88" fill="#F5F6FA"><tspan fill="#F0885F">&gt; /seo-kit</tspan> audit https://example.com<tspan class="cursor" fill="#F0885F"> ▍</tspan></text>

      <g class="row r1"><text x="30" y="136" fill="#3FB950">✓</text><text x="56" y="136" fill="#C9D1E6">Technical</text><text x="300" y="136" fill="#3FB950">crawlable, indexable</text></g>
      <g class="row r2"><text x="30" y="170" fill="#3FB950">✓</text><text x="56" y="170" fill="#C9D1E6">Schema</text><text x="300" y="170" fill="#3FB950">6 types valid</text></g>
      <g class="row r3"><text x="30" y="204" fill="#D29922">!</text><text x="56" y="204" fill="#C9D1E6">Core Web Vitals</text><text x="300" y="204" fill="#D29922">LCP 3.1s</text></g>
      <g class="row r4"><text x="30" y="238" fill="#3FB950">✓</text><text x="56" y="238" fill="#C9D1E6">Content E-E-A-T</text><text x="300" y="238" fill="#3FB950">strong</text></g>
      <g class="row r5"><text x="30" y="272" fill="#F85149">✗</text><text x="56" y="272" fill="#C9D1E6">AI search (GEO)</text><text x="300" y="272" fill="#F85149">AI assistants blocked</text></g>
    </g>

    <line x1="30" y1="304" x2="570" y2="304" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- score -->
    <g transform="translate(84 368)">
      <circle r="48" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="9"/>
      <circle r="48" fill="none" stroke="#3FB950" stroke-width="9" stroke-linecap="round" class="ring" transform="rotate(-90)"/>
      <text y="9" text-anchor="middle" class="sans" font-size="28" font-weight="800" fill="#F5F6FA">82</text>
    </g>
    <g class="sans row r6">
      <text x="160" y="358" font-size="19" font-weight="700" fill="#F5F6FA">SEO health score</text>
      <text x="160" y="386" font-size="15" fill="#8590AD">3 quick wins in your action plan</text>
    </g>
  </g>
</svg>
